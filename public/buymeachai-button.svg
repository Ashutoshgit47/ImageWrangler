<svg xmlns="http://www.w3.org/2000/svg" width="460" height="120" viewBox="0 0 460 120" fill="none">
  <!-- Pill Background matching Ko-fi badge -->
  <rect width="460" height="120" rx="60" fill="#222325" />

  <!-- Steam lines above chai glass -->
  <path d="M56 26 C54 20 60 16 57 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M64 24 C62 18 68 14 65 8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 26 C70 20 76 16 73 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chai Cutting Glass -->
  <path d="M42 38 H86 L78 98 C77.2 102.5 73.5 105 69 105 H59 C54.5 105 50.8 102.5 50 98 L42 38 Z" fill="#222325" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Glass fluting / ribs -->
  <line x1="45" y1="58" x2="83" y2="58" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  <line x1="48" y1="74" x2="80" y2="74" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />

  <!-- Heart inside glass -->
  <path d="M64 92 C64 92 53.5 84 53.5 75 C53.5 68.5 59 64.5 64 69 C69 64.5 74.5 68.5 74.5 75 C74.5 84 64 92 64 92 Z" fill="#f59e0b" />

  <!-- Typography matching Ko-fi button -->
  <text x="116" y="74" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.3px">Buy Me A Chai</text>
</svg>
